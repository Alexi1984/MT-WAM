train:
  _target_: mtwam.datasets.lerobot.robot_video_dataset.RobotVideoDataset
  dataset_dirs:
  - ${paths.data}/robotwin2.0/robotwin2.0
  shape_meta:
    images:
    - key: cam_high
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    - key: cam_left_wrist
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    - key: cam_right_wrist
      raw_shape:
      - 3
      - 480
      - 640
      shape:
      - 3
      - 240
      - 320
    action:
    - key: default
      raw_shape: 14
      shape: 14
    state:
    - key: default
      raw_shape: 14
      shape: 14
  num_frames: 33
  global_sample_stride: 1
  action_video_freq_ratio: 4
  video_size:
  - 384
  - 320
  camera_key: null
  val_set_proportion: 0.0
  is_training_set: true
  pretrained_norm_stats: ${paths.data}/robotwin2.0/dataset_stats.json
  skip_padding_as_possible: false
  concat_multi_camera: robotwin
  processor:
    _target_: mtwam.datasets.lerobot.processors.mtwam_processor.MTWAMProcessor
    shape_meta: ${data.train.shape_meta}
    num_obs_steps: ${data.train.num_frames}
    num_output_cameras: 3
    action_output_dim: 14
    proprio_output_dim: 14
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: z-score
    norm_exception_mode: null
    action_state_merger:
      _target_: mtwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms:
    - _target_: mtwam.datasets.lerobot.transforms.image.ToTensor
    - _target_: torchvision.transforms.Resize
      size:
      - 240
      - 320
    val_transforms:
    - _target_: mtwam.datasets.lerobot.transforms.image.ToTensor
    - _target_: torchvision.transforms.Resize
      size:
      - 240
      - 320
  text_embedding_cache_dir: ${paths.data}/text_embeds_cache/robotwin
  context_len: 128
  num_extra_ref_frames: 0
  enable_dynamic_branch: true
  online_teacher: true
  dynamic_branch_horizon: 2
  teacher_feature_cache_dir: null
  latent_cache_dir: null
  include_episodes_file: configs/data/splits/robotwin_clean_train.txt
  use_cached_latent: false

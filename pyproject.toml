[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-wam"
version = "0.1.0"
description = "MT-WAM: motion and appearance supervision for world-action modeling"
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "einops==0.8.1",
  "ftfy==6.3.1",
  "gitpython==3.1.45",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "packaging==25.0",
  "pillow==12.0.0",
  "pyyaml==6.0.2",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "timm==1.0.28",
  "torch==2.7.1",
  "torchvision==0.22.1",
  "tqdm==4.66.5",
  "transformers==4.49.0",
  "typing-extensions==4.15.0",
]

[project.optional-dependencies]
data = [
  "accelerate==1.12.0",
  "av==16.0.1",
  "datasets==3.6.0",
  "jsonlines==4.0.0",
  "pandas==2.2.3",
  "pyarrow==23.0.0",
]
train = [
  "mt-wam[data]",
  "deepspeed==0.18.5",
  "torchcodec==0.5; platform_system == 'Linux'",
]
logging = ["wandb==0.23.1"]
download = ["modelscope==1.34.0"]
libero = [
  "bddl==1.0.1",
  "cloudpickle==2.2.1",
  "easydict==1.9",
  "gym==0.25.2",
  "h5py==3.14.0",
  "mujoco==3.3.2",
  "opencv-python==4.6.0.66",
  "pandas==2.2.3",
  "robosuite==1.4.0",
  "scipy==1.15.3",
]
robotwin = [
  "gymnasium==0.29.1",
  "h5py==3.14.0",
  "importlib-resources==6.5.2",
  "mplib==0.2.1",
  "networkx==3.4.2",
  "ninja==1.11.1.3",
  "numpy-quaternion==2024.0.8",
  "open3d==0.18.0",
  "opencv-python==4.6.0.66",
  "pybind11==2.13.6",
  "sapien==3.0.0b1",
  "scikit-image==0.25.2",
  "scipy==1.15.3",
  "setuptools==80.9.0",
  "setuptools-scm==8.2.0",
  "toppra==0.6.3",
  "transforms3d==0.4.2",
  "trimesh==4.4.3",
  "warp-lang==1.8.0",
  "wheel==0.45.1",
  "yourdfpy==0.0.58",
]
test = ["mt-wam[data]", "pytest==8.4.2", "build==1.3.0", "ruff==0.12.12"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mtwam*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "gpu: requires a CUDA device and/or real Wan2.2 weights (excluded from the fast CPU loop; run with `pytest -m gpu`)",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]

name: Checks
'on':
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python }}
        cache: pip
    - run: python -m pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
    - run: python -m pip install -e '.[test]'
    - run: python -m pip check
    - run: python scripts/check_release.py
    - run: python -m ruff check src scripts experiments tests third_party/RoboTwin
    - run: python -m ruff format --check src scripts experiments tests third_party/RoboTwin
    - run: python -m pytest -m 'not gpu'
    - run: python -m build
    - run: python scripts/check_release.py --archive dist/mt_wam-0.1.0-py3-none-any.whl --archive dist/mt_wam-0.1.0.tar.gz
